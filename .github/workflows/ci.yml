name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Pemindaian dependensi bersifat informatif: kegagalan advisory tidak
      # memblokir merge, tetapi hasilnya terlihat di ringkasan job.
      - name: Audit dependensi (informatif)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
